[workspace]
members = ["crates/anyinfer-abi", "crates/anyinfer-sampler", "crates/anyinfer-plan", "crates/anyinfer-kv"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# edition 2024 要求 >= 1.85；core::mem::offset_of! 从 1.77 起稳定，够用
rust-version = "1.85"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
